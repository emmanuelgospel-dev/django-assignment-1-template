{% extends 'base.html' %}
{% block title %}Delete post — Akax{% endblock %}

{% block content %}
<section class="section" style="max-width:560px; margin:0 auto;">
  <div class="container">
    <div class="card">
      <h2 style="font-size:1.5rem;">Delete "{{ post.title }}"?</h2>
      <p style="color:var(--text-secondary); margin-top:12px;">This can't be undone. The post and its views count will be gone for good.</p>
      <form method="post" style="display:flex; gap:10px; margin-top:24px;">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete permanently</button>
        <a href="{% url 'blog_detail' post.slug %}" class="btn btn-ghost">Cancel</a>
      </form>
    </div>
  </div>
</section>
{% endblock %}
